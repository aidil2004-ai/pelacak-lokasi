<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantau Lokasi - Realtime Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Canvas Background Partikel */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            gap: 15px;
        }

        /* Header Informasi Transparan */
        .info-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 16px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
        }

        .status-badge {
            font-size: 14px;
            font-weight: 600;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Wadah Peta Leaflet */
        .map-wrapper {
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        /* Styling Marker Radar */
        .radar-container {
            position: relative;
            width: 24px;
            height: 24px;
        }

        .radar-dot {
            width: 20px;
            height: 20px;
            background: #00d2ff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00d2ff;
            position: absolute;
            top: 2px;
            left: 2px;
        }

        .radar-pulse {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 210, 255, 0.4);
            animation: pulse 1.8s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <div class="info-card">
            <h3>📡 Peta Pemantauan Realtime</h3>
            <div id="info" class="status-badge">Menunggu data lokasi...</div>
        </div>

        <div class="map-wrapper">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // --- 1. ANIMASI BACKGROUND CANVAS ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 114, 255, ${0.12 * (1 - dist / 130)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();


        // --- 2. INSIALISASI PETA LEAFLET ---
        const map = L.map('map').setView([-2.5489, 118.0149], 5);
        
        // Peta Detail OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Marker Kustom Radar
        const radarIcon = L.divIcon({
            className: 'custom-radar-icon',
            html: '<div class="radar-container"><div class="radar-pulse"></div><div class="radar-dot"></div></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        let marker;


        // --- 3. KONEKSI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCZa5gNwHXsue-GjIrxPKE8qWmsrC-rgMQ",
            authDomain: "pelacak-lokasi-9074d.firebaseapp.com",
            databaseURL: "https://pelacak-lokasi-9074d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pelacak-lokasi-9074d",
            storageBucket: "pelacak-lokasi-9074d.firebasestorage.app",
            messagingSenderId: "749144288015",
            appId: "1:749144288015:web:db015175a0d826aa8e2c7a",
            measurementId: "G-3MEBEKYKEB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('lokasi/target').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const { lat, lng, time } = data;
                document.getElementById('info').innerText = `Terupdate (${time}): ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                
                if (!marker) {
                    marker = L.marker([lat, lng], { icon: radarIcon }).addTo(map);
                } else {
                    marker.setLatLng([lat, lng]);
                }
                map.setView([lat, lng], 17, { animate: true });
            }
        });
    </script>
</body>
</html>
